<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Rent Tracker</title>
  <defs>
    <linearGradient id="rt-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4357C4"/>
      <stop offset="1" stop-color="#1F2C6B"/>
    </linearGradient>
    <linearGradient id="rt-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rt-coin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD166"/>
      <stop offset="1" stop-color="#F0A21A"/>
    </linearGradient>
  </defs>
  <!-- Tile -->
  <rect width="512" height="512" rx="116" fill="url(#rt-bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#rt-shine)"/>
  <!-- House -->
  <path d="M256 104 L414 236 H374 V400 H138 V236 H98 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="28" stroke-linejoin="round"/>
  <!-- Paid coin -->
  <circle cx="256" cy="312" r="70" fill="#1F2C6B" opacity="0.18"/>
  <circle cx="256" cy="306" r="66" fill="url(#rt-coin)"/>
  <circle cx="256" cy="306" r="50" fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="6"/>
  <path d="M228 306 L250 328 L288 288" fill="none" stroke="#1F2C6B" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
